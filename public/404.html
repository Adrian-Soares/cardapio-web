<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cardápio Digital</title>
    <!--
      SPA no GitHub Pages (spa-github-pages, de rafgraph).
      Converte /cardapio-web/algum-slug em /cardapio-web/?/algum-slug e recarrega o
      index.html, que devolve a rota original. pathSegmentsToKeep=1 mantém /cardapio-web/.
      Na Hostinger este arquivo não é usado (quem cuida das rotas é o .htaccess).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
